name: Deploy to Production

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/eisendev/novaryn-backend
  FRONTEND_IMAGE: ghcr.io/eisendev/novaryn-frontend

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./docker/backend/Dockerfile.prod
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./docker/frontend/Dockerfile.prod
          build-args: |
            NEXT_PUBLIC_API_URL=https://novaryn.tech/api/v1
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Azure VM
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e

            echo "Setting up application directory..."
            mkdir -p /var/www/novaryn
            cd /var/www/novaryn

            # Clone or pull latest code
            if [ -d ".git" ]; then
              echo "Pulling latest changes..."
              git fetch origin main
              git reset --hard origin/main
            else
              echo "Initializing repository in non-empty directory..."
              git init
              git remote add origin https://github.com/EisenDev/Novaryn.git
              git fetch origin main
              git checkout -f -B main origin/main
            fi

            # Log in to GitHub Container Registry on the VM (fallback to GITHUB_TOKEN if GHCR_TOKEN is empty)
            echo "${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull, recreate, and run containers
            echo "Pulling latest images from GHCR..."
            sudo docker compose -f docker-compose.prod.yml --env-file .env.prod pull

            echo "Starting containers..."
            sudo docker compose -f docker-compose.prod.yml --env-file .env.prod up -d

            # Wait for DB connections to be ready
            sleep 10

            # Run migrations
            echo "Running database migrations..."
            sudo docker compose -f docker-compose.prod.yml --env-file .env.prod exec -T backend php artisan migrate --force

            # Clear caches after deploy
            echo "Clearing application caches..."
            sudo docker compose -f docker-compose.prod.yml --env-file .env.prod exec -T backend php artisan config:cache
            sudo docker compose -f docker-compose.prod.yml --env-file .env.prod exec -T backend php artisan route:cache

            # Clean up unused Docker resources
            sudo docker image prune -f

            echo "Deployment complete! Site is live at https://novaryn.tech"
