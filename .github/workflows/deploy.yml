name: 🚀 Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Azure VM
    runs-on: ubuntu-latest

    steps:
      - name: 🔐 Checkout repository
        uses: actions/checkout@v4

      - name: 🚢 Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e

            echo "📂 Setting up application directory..."
            mkdir -p /var/www/novaryn
            cd /var/www/novaryn

            # Clone or pull latest code
            if [ -d ".git" ]; then
              echo "🔄 Pulling latest changes..."
              git fetch origin main
              git reset --hard origin/main
            else
              echo "📥 Cloning repository..."
              git clone https://github.com/${{ github.repository }}.git .
            fi

            # Write the production .env file for docker compose
            echo "⚙️  Writing production environment file..."
            cat > .env.prod << 'ENVEOF'
            APP_KEY=${{ secrets.APP_KEY }}
            DB_DATABASE=postgres
            DB_USERNAME=postgres.dgterugnouvltpzwafnx
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            ENVEOF

            # Build and restart containers
            echo "🐳 Building Docker images..."
            sudo docker compose -f docker-compose.prod.yml --env-file .env.prod pull --ignore-buildable || true
            sudo docker compose -f docker-compose.prod.yml --env-file .env.prod build --no-cache

            echo "🚀 Starting containers..."
            sudo docker compose -f docker-compose.prod.yml --env-file .env.prod up -d

            # Wait for DB to be healthy
            echo "⏳ Waiting for database..."
            sleep 15

            # Run migrations
            echo "🗄️  Running database migrations..."
            sudo docker compose -f docker-compose.prod.yml --env-file .env.prod exec -T backend php artisan migrate --force

            # Clear caches after deploy
            echo "🧹 Clearing application caches..."
            sudo docker compose -f docker-compose.prod.yml --env-file .env.prod exec -T backend php artisan config:cache
            sudo docker compose -f docker-compose.prod.yml --env-file .env.prod exec -T backend php artisan route:cache

            # Clean up unused Docker resources
            sudo docker image prune -f

            echo "✅ Deployment complete! Site is live at https://novaryn.tech"
